 <linearGradient id="shorts" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dedee0"/><stop offset=".32" stop-color="#aaaab0"/><stop offset=".55" stop-color="#ededee"/><stop offset=".79" stop-color="#bfc0c4"/><stop offset="1" stop-color="#f1f0f2"/></linearGradient>
